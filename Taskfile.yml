version: "3"

vars:
  BIN: bin/tomeshelf

tasks:
  web:install:
    desc: Install the browser app's dependencies from the lockfile.
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  build:web:
    desc: Build the browser app into web/dist, which the binary embeds.
    deps: [web:install]
    dir: web
    env:
      TOMESHELF_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - pnpm run build

  build:
    desc: Build the browser app, then the tomeshelf binary.
    cmds:
      - task: build:web
      - go build -o {{.BIN}} ./cmd/tomeshelf

  generate:
    desc: Regenerate the sqlc query code in internal/store/dbq from queries.sql and the migrations.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  test:go:
    desc: Check Go formatting, vet and run the Go tests.
    cmds:
      - test -z "$(gofmt -l cmd internal web)"
      - go vet ./...
      - go test ./...

  test:web:
    desc: Run Vitest.
    deps: [web:install]
    dir: web
    cmds:
      - pnpm run test

  typecheck:
    desc: Type-check the browser app.
    deps: [web:install]
    dir: web
    cmds:
      - pnpm run typecheck

  lint:
    desc: Check the browser app with Biome.
    deps: [web:install]
    dir: web
    cmds:
      - pnpm run lint

  ci:
    desc: Run the same checks as CI. Needs no secrets and no container tooling.
    cmds:
      - task: lint
      - task: typecheck
      - task: test:web
      - task: build
      - task: test:go

  deploy:check:
    desc: Check the deployment examples in deploy/. Needs Docker with Compose, ko, curl and jq.
    cmds:
      - task: deploy:check:kubernetes
      - task: deploy:check:compose

  deploy:check:kubernetes:
    desc: Validate the Kubernetes example and its single-replica rules. Needs no cluster.
    cmds:
      - bash deploy/check-kubernetes.sh

  deploy:check:compose:
    desc: Build the image into the local Docker daemon with ko and smoke-test the Compose example on it.
    cmds:
      - task: build:web
      - bash deploy/check-compose.sh

  e2e:
    desc: Build the binary, start it, and run the Playwright tests against it.
    cmds:
      - task: build
      - cd web && pnpm run e2e
    env:
      TOMESHELF_BIN: "{{.ROOT_DIR}}/{{.BIN}}"

  shots:
    desc: "Build the binary and run a throwaway screenshot script: task shots -- path/to/script.ts"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: build
      - SHOTS_DIR="${SHOTS_DIR:-{{.ROOT_DIR}}/tmp/shots}" node {{.CLI_ARGS}}
    env:
      TOMESHELF_BIN: "{{.ROOT_DIR}}/{{.BIN}}"
